version: "3.8"

services:
  app:
    build: .
    container_name: sanaq_ai_app
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./sanaq.db:/app/sanaq.db
      - ./app.log:/app/app.log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  bot:
    build: .
    container_name: sanaq_ai_bot
    restart: always
    env_file:
      - .env
    command: python tg_admin_bot.py
    volumes:
      - ./sanaq.db:/app/sanaq.db
      - ./app.log:/app/app.log
    depends_on:
      - app
